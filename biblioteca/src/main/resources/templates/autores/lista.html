<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Autores</title>
</head>
<body>
<h1>Autores</h1>
<a th:href="@{/autores/novo}">Cadastrar Autor</a>
<table border="1">
    <thead>
        <tr><th>Nome</th><th>Nacionalidade</th><th>Ação</th></tr>
    </thead>
    <tbody>
        <tr th:each="autor, status : ${autores}">
            <td th:text="${autor.nome}"></td>
            <td th:text="${autor.nacionalidade}"></td>
            <td>
                <a th:href="@{/autores/excluir/{indice}(indice=${status.index})}">Excluir</a>
            </td>
        </tr>
    </tbody>
</table>
</body>
</html>
